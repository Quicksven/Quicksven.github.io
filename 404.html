<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost at sea — Sven's Tools</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--paper:#efe2c3;--ink:#2c2213;--muted:#857049;--gold:#9c7a2e}
@media (prefers-color-scheme:dark){:root{--paper:#0f1620;--ink:#eaddbe;--muted:#9a8a66;--gold:#c8a24a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:48px 16px;text-align:center;background:var(--paper);color:var(--ink);
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  background-image:radial-gradient(120% 90% at 50% -10%,rgba(255,255,255,.3),transparent 60%),radial-gradient(120% 120% at 50% 120%,rgba(50,32,10,.18),transparent 55%)}
img{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--gold),0 8px 24px rgba(40,25,5,.3);margin-bottom:8px}
h1{font-family:"Cinzel",Georgia,serif;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(28px,7vw,44px);margin:0}
p{color:var(--muted);font-style:italic;font-size:18px;margin:4px 0 0;max-width:30em}
.big{font-family:"Cinzel",Georgia,serif;font-size:60px;letter-spacing:.2em;color:var(--gold);margin:0}
a{margin-top:18px;font-family:"Cinzel",Georgia,serif;letter-spacing:.08em;font-weight:600;text-transform:uppercase;font-size:14px;
  color:var(--paper);background:var(--gold);text-decoration:none;padding:12px 22px;border-radius:40px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <img src="/pt-logo.jpg" alt="Sven's Tools crest">
  <p class="big">404</p>
  <h1>Lost at sea</h1>
  <p>This chart doesn&rsquo;t exist — the waters here are uncharted. Set a course back to port.</p>
  <a href="/">Return to deck</a>
</body>
</html>
