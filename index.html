<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quicksven · Tools</title>
<style>
:root{--bg:#eef5fb;--panel:#fff;--line:#d4e4f1;--text:#0f2a43;--muted:#5c7793;--accent:#0b76c4;--accent2:#005073}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1826;--panel:#0f2234;--line:#25405a;--text:#e9f2fb;--muted:#93aabf;--accent:#38bdf8;--accent2:#7cc6ef}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:48px 20px}
header{text-align:center;margin-bottom:32px}
.logo{width:56px;height:56px;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:20px}
h1{margin:0 0 6px;font-size:26px}
header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;width:100%;max-width:760px}
a.tool{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;text-decoration:none;color:inherit;transition:.15s;box-shadow:0 8px 24px rgba(10,60,110,.06)}
a.tool:hover{border-color:var(--accent);transform:translateY(-2px)}
a.tool .k{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
a.tool h2{margin:6px 0 6px;font-size:18px}
a.tool p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">QS</div>
  <h1>Quicksven · Tools</h1>
  <p>Interactive study guides</p>
</header>
<main class="grid">
  <a class="tool" href="cisco-packet-tracer.html">
    <div class="k">Networking</div>
    <h2>Cisco Packet Tracer Config Guide</h2>
    <p>IOS commands that fill in your device values, a subnet calculator, VLANs, routing, ACLs and more.</p>
  </a>
</main>
<footer>Built as study aids · hosted on GitHub Pages</footer>
</body>
</html>
